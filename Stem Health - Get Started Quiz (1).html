document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

y: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8f767403-e32b-4475-8af7-12b0194bf191\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2a51879c-57d6-4b44-b754-841fc1ccd16f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"478ae2f2-fc9d-4518-84ef-4d9b698c80ed\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; background: #FAF8F5; }\n    ::selection { background: #E7E1D6; }\n    a { color: #2E4457; }\n    a:hover { color: #1F303E; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Manrope',sans-serif; min-height:100vh; background:#FAF8F5; display:flex; flex-direction:column; align-items:center; box-sizing:border-box;\">\n\n  <!-- STEP 0: WELCOME -->\n  <sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:100%; max-width:1180px; margin:0 auto; display:flex; min-height:100vh; box-sizing:border-box;\">\n      <div style=\"flex:1 1 42%; background:#C9BEB1; padding:72px 56px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:24px;\">\n        <div style=\"font-family:'Newsreader',serif; font-size:26px; letter-spacing:0.04em; color:#2B221D;\">STEM HEALTH<\u002Fdiv>\n        <h1 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:44px; line-height:1.15; color:#2B221D; margin:0;\">A health plan built around you.<\u002Fh1>\n        <p style=\"font-size:16px; line-height:1.6; color:#2B221D; opacity:0.75; margin:0; max-width:400px;\">Answer a few quick questions and we'll match you to the right care — whether that's a one-day assessment, ongoing membership, or a benefit for your team.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 58%; padding:72px 64px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:28px; max-width:620px;\">\n        <div>\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#7C8A73; margin-bottom:12px;\">Get started<\u002Fdiv>\n          <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 12px;\">Let's find your plan.<\u002Fh2>\n          <p style=\"font-size:16px; line-height:1.6; color:#2B221D; opacity:0.72; margin:0;\">Takes about 2 minutes. At the end, you'll get a personalized recommendation — sign up online right away, or ask us to reach out.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n            <div style=\"width:26px; height:26px; border-radius:50%; background:#EEF2F5; color:#2E4457; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">1<\u002Fdiv>\n            <div style=\"font-size:15px; color:#2B221D; opacity:0.8; padding-top:3px;\">Tell us who this is for, and what you're hoping to get out of care.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n            <div style=\"width:26px; height:26px; border-radius:50%; background:#EEF2F5; color:#2E4457; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">2<\u002Fdiv>\n            <div style=\"font-size:15px; color:#2B221D; opacity:0.8; padding-top:3px;\">We'll match you to a plan — Origin Pass, Foundation, Signature, or a team benefit.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n            <div style=\"width:26px; height:26px; border-radius:50%; background:#EEF2F5; color:#2E4457; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">3<\u002Fdiv>\n            <div style=\"font-size:15px; color:#2B221D; opacity:0.8; padding-top:3px;\">Sign up online, or ask our care team to call you instead.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ start }}\" style=\"align-self:flex-start; padding:16px 34px; border-radius:10px; border:none; background:#2B221D; color:#FAF8F5; font-size:15px; font-weight:700; font-family:'Manrope',sans-serif; cursor:pointer; margin-top:8px;\">Start my assessment →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SHARED SHELL FOR STEPS 1-6 -->\n  <sc-if value=\"{{ isQuizStep }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:100%; max-width:720px; margin:0 auto; padding:52px 24px 100px; box-sizing:border-box; display:flex; flex-direction:column; gap:36px;\">\n      <div style=\"display:flex; flex-direction:column; gap:16px;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n          <div style=\"font-family:'Newsreader',serif; font-size:19px; letter-spacing:0.03em; color:#2B221D;\">STEM HEALTH<\u002Fdiv>\n          <div style=\"font-size:13px; font-weight:600; color:#7C8A73;\">{{ stepLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:100%; height:5px; border-radius:3px; background:#EEEAE2;\"><div style=\"width:{{ progressPct }}; height:100%; border-radius:3px; background:#2E4457; transition:width 0.3s ease;\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- STEP 1: SEGMENT -->\n      <sc-if value=\"{{ isSegment }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">Who is this for?<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">This shapes the rest of your questions.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ segmentOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ opt.onSelect }}\" style=\"cursor:pointer; padding:22px 24px; border-radius:14px; background:{{ opt.bg }}; border:1.5px solid {{ opt.border }}; display:flex; flex-direction:column; gap:6px; transition:all 0.15s ease;\">\n                <div style=\"font-size:17px; font-weight:700; color:{{ opt.color }};\">{{ opt.title }}<\u002Fdiv>\n                <div style=\"font-size:14px; color:{{ opt.descColor }}; line-height:1.5;\">{{ opt.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 2: GOALS (individual) -->\n      <sc-if value=\"{{ isGoals }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">What matters most to you?<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">Pick as many as apply.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px;\">\n            <sc-for list=\"{{ goalOptions }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ g.onToggle }}\" style=\"cursor:pointer; padding:13px 20px; border-radius:100px; background:{{ g.bg }}; border:1.5px solid {{ g.border }}; color:{{ g.color }}; font-size:14px; font-weight:600;\">{{ g.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 2: TEAM SIZE (business) -->\n      <sc-if value=\"{{ isTeamSize }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">How big is your team?<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">This helps us scope the right program.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ teamSizeOptions }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ t.onSelect }}\" style=\"cursor:pointer; padding:16px 20px; border-radius:12px; background:{{ t.bg }}; border:1.5px solid {{ t.border }}; color:{{ t.color }}; font-size:15px; font-weight:600;\">{{ t.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 3: CARE STATUS (individual) -->\n      <sc-if value=\"{{ isCareStatus }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">Where are you starting from?<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">Pick the one that fits best.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ careStatusOptions }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ c.onSelect }}\" style=\"cursor:pointer; padding:18px 20px; border-radius:12px; background:{{ c.bg }}; border:1.5px solid {{ c.border }}; color:{{ c.color }}; font-size:15px; font-weight:600;\">{{ c.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 3: TIMELINE (business) -->\n      <sc-if value=\"{{ isBizTimeline }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">What's your timeline?<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">So we can plan the right conversation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ bizTimelineOptions }}\" as=\"tl\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ tl.onSelect }}\" style=\"cursor:pointer; padding:18px 20px; border-radius:12px; background:{{ tl.bg }}; border:1.5px solid {{ tl.border }}; color:{{ tl.color }}; font-size:15px; font-weight:600;\">{{ tl.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 4: URGENCY (individual) -->\n      <sc-if value=\"{{ isUrgency }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">How soon do you want to start?<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ urgencyOptions }}\" as=\"u\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ u.onSelect }}\" style=\"cursor:pointer; padding:18px 20px; border-radius:12px; background:{{ u.bg }}; border:1.5px solid {{ u.border }}; color:{{ u.color }}; font-size:15px; font-weight:600;\">{{ u.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 4: BIZ INTEREST (business) -->\n      <sc-if value=\"{{ isBizInterest }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">What's driving this for your team?<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">Pick as many as apply.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px;\">\n            <sc-for list=\"{{ bizInterestOptions }}\" as=\"bi\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ bi.onToggle }}\" style=\"cursor:pointer; padding:13px 20px; border-radius:100px; background:{{ bi.bg }}; border:1.5px solid {{ bi.border }}; color:{{ bi.color }}; font-size:14px; font-weight:600;\">{{ bi.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 5: CONTACT INFO -->\n      <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px;\">\n          <div>\n            <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0 0 10px;\">Almost there.<\u002Fh2>\n            <p style=\"font-size:15px; color:#2B221D; opacity:0.68; margin:0;\">We'll send your personalized plan here.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:18px;\">\n            <div style=\"display:flex; gap:16px;\">\n              <div style=\"flex:1; display:flex; flex-direction:column; gap:6px;\">\n                <label style=\"font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2B221D; opacity:0.55;\">First name*<\u002Flabel>\n                <input value=\"{{ contact.firstName }}\" sc-camel-on-change=\"{{ setFirstName }}\" style=\"padding:14px 16px; border-radius:10px; border:1px solid #DAD3C8; background:#EEF2F5; font-size:15px; color:#2B221D; font-family:'Manrope',sans-serif; box-sizing:border-box;\">\n              <\u002Fdiv>\n              <div style=\"flex:1; display:flex; flex-direction:column; gap:6px;\">\n                <label style=\"font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2B221D; opacity:0.55;\">Last name*<\u002Flabel>\n                <input value=\"{{ contact.lastName }}\" sc-camel-on-change=\"{{ setLastName }}\" style=\"padding:14px 16px; border-radius:10px; border:1px solid #DAD3C8; background:#EEF2F5; font-size:15px; color:#2B221D; font-family:'Manrope',sans-serif; box-sizing:border-box;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px;\">\n              <label style=\"font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2B221D; opacity:0.55;\">Email*<\u002Flabel>\n              <input value=\"{{ contact.email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"padding:14px 16px; border-radius:10px; border:1px solid #DAD3C8; background:#EEF2F5; font-size:15px; color:#2B221D; font-family:'Manrope',sans-serif; box-sizing:border-box;\">\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px;\">\n              <label style=\"font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2B221D; opacity:0.55;\">Phone*<\u002Flabel>\n              <input value=\"{{ contact.phone }}\" sc-camel-on-change=\"{{ setPhone }}\" style=\"padding:14px 16px; border-radius:10px; border:1px solid #DAD3C8; background:#EEF2F5; font-size:15px; color:#2B221D; font-family:'Manrope',sans-serif; box-sizing:border-box;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- NAV BUTTONS (steps 1-5) -->\n      <sc-if value=\"{{ isNavStep }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-top:8px;\">\n          <div sc-camel-on-click=\"{{ back }}\" style=\"cursor:pointer; font-size:14px; font-weight:600; color:#7C8A73;\">← Back<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ next }}\" disabled=\"{{ nextDisabled }}\" style=\"padding:15px 32px; border-radius:10px; border:none; background:{{ nextBg }}; color:#FAF8F5; font-size:15px; font-weight:700; font-family:'Manrope',sans-serif; cursor:pointer; opacity:{{ nextOpacity }};\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 6: RESULTS -->\n      <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#7C8A73;\">Your personalized match<\u002Fdiv>\n          <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:32px; color:#2E4457; margin:0;\">{{ recHeadline }}<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"border-radius:20px; background:#2B221D; color:#FAF8F5; padding:36px 36px; display:flex; flex-direction:column; gap:22px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;\">\n            <div>\n              <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#C9BEB1;\">Recommended<\u002Fdiv>\n              <div style=\"font-family:'Newsreader',serif; font-size:28px; margin-top:4px;\">{{ recTierName }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right;\">\n              <div style=\"font-family:'Newsreader',serif; font-size:26px;\">{{ recPrice }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:#C9BEB1;\">{{ recPriceSub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.6; color:#EDE7DE; margin:0;\">{{ recBlurb }}<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:10px; border-top:1px solid rgba(255,255,255,0.15); padding-top:20px;\">\n            <sc-for list=\"{{ recBullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:14px; color:#EDE7DE;\">\n                <span style=\"color:#C9BEB1;\">✓<\u002Fspan><span>{{ b.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasAltNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:14px; color:#2B221D; opacity:0.65; line-height:1.5;\">{{ altNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex; flex-direction:column; gap:12px; margin-top:8px;\">\n          <sc-if value=\"{{ showSignupButton }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ chooseSignup }}\" style=\"width:100%; padding:18px 24px; border-radius:12px; border:none; background:#2E4457; color:#FAF8F5; font-size:16px; font-weight:700; font-family:'Manrope',sans-serif; cursor:pointer; box-sizing:border-box;\">{{ signupButtonLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ chooseCallback }}\" style=\"width:100%; padding:18px 24px; border-radius:12px; border:1.5px solid #2B221D; background:transparent; color:#2B221D; font-size:16px; font-weight:700; font-family:'Manrope',sans-serif; cursor:pointer; box-sizing:border-box;\">{{ callbackButtonLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ back }}\" style=\"cursor:pointer; font-size:13px; font-weight:600; color:#7C8A73; text-align:center;\">← Back to your answers<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- STEP 7: CONFIRMATION -->\n  <sc-if value=\"{{ isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:100%; max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; padding:60px 24px; box-sizing:border-box;\">\n      <div style=\"width:72px; height:72px; border-radius:50%; background:#EEF2F5; display:flex; align-items:center; justify-content:center;\">\n        <div style=\"width:26px; height:14px; border-left:3px solid #2E4457; border-bottom:3px solid #2E4457; transform:rotate(-45deg) translate(2px,-2px);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:30px; color:#2E4457; margin:0;\">{{ confirmHeadline }}<\u002Fh2>\n      <p style=\"font-size:15px; line-height:1.6; color:#2B221D; opacity:0.7; margin:0; max-width:420px;\">{{ confirmBody }}<\u002Fp>\n      <div style=\"background:#F1ECE5; border-radius:14px; padding:20px 24px; width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:6px; text-align:left;\">\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#7C8A73;\">{{ recTierName }}<\u002Fdiv>\n        <div style=\"font-family:'Newsreader',serif; font-size:20px; color:#2B221D;\">{{ recPrice }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ reset }}\" style=\"cursor:pointer; font-size:13px; font-weight:600; color:#7C8A73; margin-top:12px;\">Start over<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NAVY = '#2E4457', DARK = '#2B221D', WHITE = '#FFFFFF', BORDER = '#DAD3C8', TAUPE_L = '#F1ECE5';\n\nfunction optStyle(selected) {\n  return selected\n    ? { bg: DARK, border: DARK, color: '#FAF8F5', descColor: '#EDE7DE' }\n    : { bg: WHITE, border: BORDER, color: DARK, descColor: 'rgba(43,34,29,0.65)' };\n}\n\nclass Component extends DCLogic {\n  state = {\n    step: 0,\n    segment: null,\n    goals: [],\n    careStatus: null,\n    urgency: null,\n    teamSize: null,\n    bizInterest: [],\n    timeline: null,\n    contact: { firstName: '', lastName: '', email: '', phone: '' },\n    ctaChoice: null,\n  };\n\n  start = () => this.setState({ step: 1 });\n  back = () => this.setState(s => ({ step: Math.max(1, s.step - 1) }));\n  reset = () => this.setState({ step: 0, segment: null, goals: [], careStatus: null, urgency: null, teamSize: null, bizInterest: [], timeline: null, contact: { firstName: '', lastName: '', email: '', phone: '' }, ctaChoice: null });\n\n  selectSegment = (id) => this.setState({ segment: id, step: 2 });\n  toggleGoal = (id) => this.setState(s => ({ goals: s.goals.includes(id) ? s.goals.filter(g => g !== id) : [...s.goals, id] }));\n  selectCareStatus = (id) => this.setState({ careStatus: id });\n  selectUrgency = (id) => this.setState({ urgency: id });\n  selectTeamSize = (id) => this.setState({ teamSize: id });\n  selectTimeline = (id) => this.setState({ timeline: id });\n  toggleBizInterest = (id) => this.setState(s => ({ bizInterest: s.bizInterest.includes(id) ? s.bizInterest.filter(g => g !== id) : [...s.bizInterest, id] }));\n\n  setFirstName = (e) => this.setState(s => ({ contact: { ...s.contact, firstName: e.target.value } }));\n  setLastName = (e) => this.setState(s => ({ contact: { ...s.contact, lastName: e.target.value } }));\n  setEmail = (e) => this.setState(s => ({ contact: { ...s.contact, email: e.target.value } }));\n  setPhone = (e) => this.setState(s => ({ contact: { ...s.contact, phone: e.target.value } }));\n\n  next = () => {\n    const s = this.state;\n    if (s.step === 5) { this.setState({ step: 6 }); return; }\n    this.setState(st => ({ step: st.step + 1 }));\n  };\n\n  chooseSignup = () => this.setState({ ctaChoice: 'signup', step: 7 });\n  chooseCallback = () => this.setState({ ctaChoice: 'callback', step: 7 });\n\n  getRecommendation() {\n    const s = this.state;\n    if (s.segment === 'assessment') {\n      return {\n        headline: 'A one-day assessment, no membership needed.',\n        name: 'Origin Pass — Whole Body Assessment',\n        price: '$3,595',\n        priceSub: 'one-time, à la carte',\n        blurb: \"Origin Pass lets you book paid services without committing to a membership — ideal for a single, comprehensive check-in on your health.\",\n        bullets: ['Whole Body MRI at our partner facility, read back to you by a physician', 'Biomarker testing and genetic screening available à la carte', 'Book once — no recurring commitment or dedicated care team'],\n        altNote: 'Want ongoing care instead of a one-time visit? Go back and choose \"Ongoing personalized care.\"',\n        showSignup: true,\n        signupLabel: 'Book my assessment — $3,595',\n        callbackLabel: 'Have a question first? Request a callback',\n      };\n    }\n    if (s.segment === 'membership') {\n      const wantsWhiteGlove = s.careStatus === 'whiteglove' || s.goals.includes('executive');\n      if (wantsWhiteGlove) {\n        return {\n          headline: 'Built for hands-on, always-on access.',\n          name: 'Signature Membership',\n          price: '$8,956/yr',\n          priceSub: 'Founding Member rate · $11,195 + tax retail',\n          blurb: 'Signature is our highest tier — direct access to your physician, more visits, and a dedicated Nurse Consultant for anything that comes up.',\n          bullets: ['Direct in-app, phone, or email access to your physician', 'Up to 4 physician visits a year, at home or your office', 'Dedicated Nurse Consultant, plus genetic screening included'],\n          altNote: 'Foundation ($3,596/yr Founding rate) covers the essentials with a dedicated physician if you\\u2019d rather start lighter.',\n          showSignup: true,\n          signupLabel: 'Sign up for Signature — $8,956/yr',\n          callbackLabel: 'Talk it through first — request a callback',\n        };\n      }\n      return {\n        headline: 'Proactive, personalized primary care.',\n        name: 'Foundation Membership',\n        price: '$3,596/yr',\n        priceSub: 'Founding Member rate · $4,495 + tax retail',\n        blurb: 'Foundation pairs you with a dedicated physician and care advocate, plus a 6-month health plan built around your goals.',\n        bullets: ['Dedicated physician who knows your full health story', '45-minute intake and a clinician-reviewed 6-month health plan', 'Same/next-day virtual visits and on-call nurses after hours'],\n        altNote: 'Want faster access and more in-person visits? Signature ($8,956/yr Founding rate) adds direct physician messaging and up to 4 visits a year.',\n        showSignup: true,\n        signupLabel: 'Sign up for Foundation — $3,596/yr',\n        callbackLabel: 'Talk it through first — request a callback',\n      };\n    }\n    // business\n    return {\n      headline: 'A health benefit built for your team.',\n      name: 'Team (B2B) Program',\n      price: 'Custom pricing',\n      priceSub: 'negotiated for your organization',\n      blurb: 'Our Team plan brings proactive care and preferred pricing to your employees, with a dedicated Care Advocate for your organization.',\n      bullets: ['Quarterly Care Advocate touchpoints for your team', 'Preferred employee pricing on Foundation & Signature upgrades', 'Scoped to your headcount, budget, and rollout timeline'],\n      altNote: '',\n      showSignup: false,\n      signupLabel: '',\n      callbackLabel: 'Talk to our team',\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isIndividual = s.segment === 'assessment' || s.segment === 'membership';\n    const isBusiness = s.segment === 'business';\n\n    const segmentOptions = [\n      { id: 'assessment', title: 'A one-day health assessment', desc: 'Full body MRI, biomarker testing, and genetic screening — no membership required.' },\n      { id: 'membership', title: 'Ongoing personalized care', desc: 'A dedicated physician and care team, all year, for myself.' },\n      { id: 'business', title: 'Benefits for my team', desc: 'I\\u2019m exploring this as a benefit for employees.' },\n    ].map(o => ({ ...o, onSelect: () => this.selectSegment(o.id), ...optStyle(s.segment === o.id) }));\n\n    const goalDefs = [\n      { id: 'baseline', label: 'A full picture of my current health' },\n      { id: 'early', label: 'Catching potential issues early' },\n      { id: 'proactive', label: 'Proactive care, not just sick visits' },\n      { id: 'access', label: 'Faster, easier access to a doctor' },\n      { id: 'concern', label: 'Managing a specific condition' },\n      { id: 'executive', label: 'Executive-level convenience' },\n    ];\n    const goalOptions = goalDefs.map(g => ({ ...g, onToggle: () => this.toggleGoal(g.id), ...(s.goals.includes(g.id) ? { bg: DARK, border: DARK, color: '#FAF8F5' } : { bg: WHITE, border: BORDER, color: DARK }) }));\n\n    const careStatusDefs = [\n      { id: 'none', label: 'I don\\u2019t have a family doctor right now' },\n      { id: 'proactive', label: 'I have a doctor, but want more proactive care' },\n      { id: 'whiteglove', label: 'I want white-glove access — a direct line to my physician' },\n    ];\n    const careStatusOptions = careStatusDefs.map(c => ({ ...c, onSelect: () => this.selectCareStatus(c.id), ...(s.careStatus === c.id ? { bg: DARK, border: DARK, color: '#FAF8F5' } : { bg: WHITE, border: BORDER, color: DARK }) }));\n\n    const urgencyDefs = [\n      { id: 'asap', label: 'As soon as possible' },\n      { id: 'months', label: 'Within the next few months' },\n      { id: 'exploring', label: 'Just exploring for now' },\n    ];\n    const urgencyOptions = urgencyDefs.map(u => ({ ...u, onSelect: () => this.selectUrgency(u.id), ...(s.urgency === u.id ? { bg: DARK, border: DARK, color: '#FAF8F5' } : { bg: WHITE, border: BORDER, color: DARK }) }));\n\n    const teamSizeDefs = [\n      { id: 'small', label: 'Under 25 employees' },\n      { id: 'mid', label: '25–100 employees' },\n      { id: 'large', label: '100–500 employees' },\n      { id: 'xl', label: '500+ employees' },\n    ];\n    const teamSizeOptions = teamSizeDefs.map(t => ({ ...t, onSelect: () => this.selectTeamSize(t.id), ...(s.teamSize === t.id ? { bg: DARK, border: DARK, color: '#FAF8F5' } : { bg: WHITE, border: BORDER, color: DARK }) }));\n\n    const bizTimelineDefs = [\n      { id: 'now', label: 'Ready to roll out this quarter' },\n      { id: 'renewal', label: 'Planning for our next renewal cycle' },\n      { id: 'research', label: 'Just researching options' },\n    ];\n    const bizTimelineOptions = bizTimelineDefs.map(tl => ({ ...tl, onSelect: () => this.selectTimeline(tl.id), ...(s.timeline === tl.id ? { bg: DARK, border: DARK, color: '#FAF8F5' } : { bg: WHITE, border: BORDER, color: DARK }) }));\n\n    const bizInterestDefs = [\n      { id: 'preventive', label: 'Preventive care & annual checkups' },\n      { id: 'absenteeism', label: 'Reducing sick days' },\n      { id: 'executive', label: 'Executive health program' },\n      { id: 'mental', label: 'Mental health & wellness' },\n      { id: 'talent', label: 'Attracting & retaining talent' },\n    ];\n    const bizInterestOptions = bizInterestDefs.map(bi => ({ ...bi, onToggle: () => this.toggleBizInterest(bi.id), ...(s.bizInterest.includes(bi.id) ? { bg: DARK, border: DARK, color: '#FAF8F5' } : { bg: WHITE, border: BORDER, color: DARK }) }));\n\n    const stepNames = { 1: 'Step 1 of 5', 2: 'Step 2 of 5', 3: 'Step 3 of 5', 4: 'Step 4 of 5', 5: 'Step 5 of 5' };\n    const progressPct = s.step >= 1 && s.step <= 5 ? `${(s.step / 5) * 100}%` : '100%';\n\n    let nextDisabled = false;\n    if (s.step === 2) nextDisabled = isIndividual ? s.goals.length === 0 : !s.teamSize;\n    if (s.step === 3) nextDisabled = isIndividual ? !s.careStatus : !s.timeline;\n    if (s.step === 4) nextDisabled = isIndividual ? !s.urgency : s.bizInterest.length === 0;\n    if (s.step === 5) nextDisabled = !(s.contact.firstName && s.contact.lastName && s.contact.email.includes('@') && s.contact.phone);\n\n    const rec = this.getRecommendation();\n\n    return {\n      isWelcome: s.step === 0,\n      isQuizStep: s.step >= 1 && s.step <= 6,\n      isNavStep: s.step >= 1 && s.step <= 5,\n      isConfirm: s.step === 7,\n      isSegment: s.step === 1,\n      isGoals: s.step === 2 && isIndividual,\n      isTeamSize: s.step === 2 && isBusiness,\n      isCareStatus: s.step === 3 && isIndividual,\n      isBizTimeline: s.step === 3 && isBusiness,\n      isUrgency: s.step === 4 && isIndividual,\n      isBizInterest: s.step === 4 && isBusiness,\n      isContact: s.step === 5,\n      isResults: s.step === 6,\n      start: this.start,\n      back: this.back,\n      reset: this.reset,\n      next: this.next,\n      stepLabel: stepNames[s.step] || '',\n      progressPct,\n      segmentOptions,\n      goalOptions,\n      careStatusOptions,\n      urgencyOptions,\n      teamSizeOptions,\n      bizTimelineOptions,\n      bizInterestOptions,\n      contact: s.contact,\n      setFirstName: this.setFirstName,\n      setLastName: this.setLastName,\n      setEmail: this.setEmail,\n      setPhone: this.setPhone,\n      nextDisabled,\n      nextOpacity: nextDisabled ? '0.4' : '1',\n      nextBg: DARK,\n      nextLabel: s.step === 5 ? 'See my plan →' : 'Continue →',\n      recHeadline: rec.headline,\n      recTierName: rec.name,\n      recPrice: rec.price,\n      recPriceSub: rec.priceSub,\n      recBlurb: rec.blurb,\n      recBullets: rec.bullets.map(t => ({ text: t })),\n      hasAltNote: !!rec.altNote,\n      altNote: rec.altNote,\n      showSignupButton: rec.showSignup,\n      signupButtonLabel: rec.signupLabel,\n      callbackButtonLabel: rec.callbackLabel,\n      chooseSignup: this.chooseSignup,\n      chooseCallback: this.chooseCallback,\n      confirmHeadline: s.ctaChoice === 'signup' ? `You're on your way, ${s.contact.firstName || 'there'}.` : `Thanks, ${s.contact.firstName || 'there'} — we've got your details.`,\n      confirmBody: s.ctaChoice === 'signup'\n        ? `We've sent a secure checkout link to ${s.contact.email || 'your email'} to complete sign-up for your plan below.`\n        : `A member of our care team will reach out within 1 business day at ${s.contact.phone || 'your number'} or ${s.contact.email || 'your email'}.`,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
